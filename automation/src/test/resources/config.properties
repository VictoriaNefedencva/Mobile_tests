# Appium server
appium.url=http://127.0.0.1:4723

# Device
# Leave empty to auto-pick the first connected device.
# Override with env var DEVICE_NAME or system property -Ddevice.name=...
device.name=
platform.name=Android
automation.name=UiAutomator2

# App under test
app.package=md.moldcell.selfservice
app.activity=.screens.login.LoginActivity

# Timeouts (seconds)
timeout.explicit=15
timeout.new.command=120